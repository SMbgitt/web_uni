<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Упражнение 8. Средний балл и стипендия</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 400px; margin: 0 auto; }
        input[type="text"], input[type="number"] { width: 100%; padding: 6px; margin: 5px 0 15px 0; }
        input[type="submit"] { padding: 8px 20px; cursor: pointer; }
        label { font-weight: bold; }
    </style>
</head>
<body>

<h2>Расчёт среднего балла и назначение стипендии</h2>

<form action="ex8_process.php" method="post">
    <label>Фамилия:</label>
    <input type="text" name="family" placeholder="Введите фамилию" required>

    <label>Оценка по предмету 1:</label>
    <input type="number" name="mark1" min="2" max="5" required>

    <label>Оценка по предмету 2:</label>
    <input type="number" name="mark2" min="2" max="5" required>

    <label>Оценка по предмету 3:</label>
    <input type="number" name="mark3" min="2" max="5" required>

    <input type="submit" value="Рассчитать">
</form>

</body>
</html>
