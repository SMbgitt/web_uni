<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №4</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/script.js"></script>
</head>
<body>

    <h1 class="all_center">Лабораторная работа №4 — Основы JavaScript</h1>

    <!-- Упражнение 1: Alert и формы -->
    <h2>Упражнение 1. Alert и формы</h2>
    <form name="button1" class="all_center">
        <input type="button" value="ИНФО" onclick="show_information();">
    </form>

    <!-- Упражнение 2: Alert и формы (ввод данных) -->
    <h2>Упражнение 2. Alert и формы (ввод данных)</h2>
    <form name="button2" class="all_center">
        <input type="number" min="3.00" max="5.00" step="0.01" style="width: 150px;" name="sqr" placeholder="Средний балл">
        <input type="button" value="Показать средний балл" onclick="show_information2(button2.sqr);">
    </form>

    <!-- Упражнение 3: Анкета -->
    <h2>Упражнение 3. Анкета</h2>
    <h3 class="radio_button">Опрос</h3>
    <form name="questionnaire" class="radio_button">
        <input type="text" name="family" placeholder="Фамилия"><br>

        <label>Оценка по дисциплине «Программирование»:</label><br>
        <input type="radio" name="radio1" value="5" checked="checked"><label>Отлично</label><br>
        <input type="radio" name="radio1" value="4"><label>Хорошо</label><br>
        <input type="radio" name="radio1" value="3"><label>Удовлетворительно</label><br>

        <label>Оценка по дисциплине «Математика»:</label><br>
        <input type="radio" name="radio2" value="5" checked="checked"><label>Отлично</label><br>
        <input type="radio" name="radio2" value="4"><label>Хорошо</label><br>
        <input type="radio" name="radio2" value="3"><label>Удовлетворительно</label><br>

        <label>Оценка по дисциплине «Физика»:</label><br>
        <input type="radio" name="radio3" value="5" checked="checked"><label>Отлично</label><br>
        <input type="radio" name="radio3" value="4"><label>Хорошо</label><br>
        <input type="radio" name="radio3" value="3"><label>Удовлетворительно</label><br>

        <input type="button" value="Отправить" onclick="send(questionnaire.family, questionnaire.radio1, questionnaire.radio2, questionnaire.radio3);">
    </form>

    <!-- Упражнение 4: Регулярные выражения и события мыши -->
    <h2>Упражнение 4. Регулярные выражения. Типы событий мыши</h2>
    <div id="layer" ondblclick="change_color();">
        <p>Двойной клик по этому блоку меняет фон</p>
        <input type="text" id="email" placeholder="Введите e-mail" style="width: 250px;">
        <input type="button" value="Проверить" onclick="check_mail();">
        <br><br>
        <span id="result"></span>
    </div>

</body>
</html>
